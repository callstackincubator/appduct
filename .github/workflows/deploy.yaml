name: Deploy

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  lint:
    uses: ./.github/workflows/lint.yaml

  test:
    uses: ./.github/workflows/test.yaml

  package:
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm via corepack
        run: |
          mkdir -p "$RUNNER_TEMP/corepack"
          corepack enable --install-directory "$RUNNER_TEMP/corepack" pnpm
          echo "$RUNNER_TEMP/corepack" >> "$GITHUB_PATH"
          corepack prepare --activate
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # No cache: pnpm here, deliberately. This job builds and publishes release tarballs, so
          # restoring a pnpm store from a prior run's cache would let a poisoned cache entry slip
          # dependencies into a published package. Every run resolves and installs cleanly.
      - name: Validate production release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -e '
            const packages = ["shared", "appduct", "react-native"].map(
              (name) => require(`./packages/${name}/package.json`).version,
            );
            if (new Set(packages).size !== 1) throw new Error(`Package versions differ: ${packages.join(", ")}`);
            if (packages[0].includes("-")) throw new Error(`Prerelease versions are not publishable: ${packages[0]}`);
            process.stdout.write(packages[0]);
          ')
          test "$RELEASE_TAG" = "v$version"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build packages
        run: pnpm build
      - name: Pack release tarballs
        run: |
          mkdir release
          pnpm --filter @appduct/shared pack --pack-destination release
          pnpm --filter appduct pack --pack-destination release
          pnpm --filter @appduct/react-native pack --pack-destination release
      - name: Upload release tarballs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-packages
          path: release/*.tgz
          retention-days: 1
          compression-level: 0

  publish-shared:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Verify npm version
        run: >-
          node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number);
          if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1);'
          "$(npm --version)"
      - name: Download release tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-packages
          path: release
      - name: Publish shared package
        run: npm publish ./release/appduct-shared-*.tgz --access public --provenance --tag latest

  publish-cli:
    needs: publish-shared
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Verify npm version
        run: >-
          node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number);
          if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1);'
          "$(npm --version)"
      - name: Download release tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-packages
          path: release
      - name: Publish CLI package
        run: npm publish ./release/appduct-[0-9]*.tgz --access public --provenance --tag latest

  publish-react-native:
    needs: publish-shared
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Verify npm version
        run: >-
          node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number);
          if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1);'
          "$(npm --version)"
      - name: Download release tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-packages
          path: release
      - name: Publish React Native package
        run: npm publish ./release/appduct-react-native-*.tgz --access public --provenance --tag latest

  publish-cocoapods:
    # Deliberately last, after every npm publish has succeeded. A CocoaPods trunk version is
    # permanent -- `pod trunk` has no unpublish, and a version can never be replaced or reused --
    # whereas npm allows `npm unpublish` within 72 hours. So the irreversible half of the release
    # only runs once the reversible half is known good; a trunk push that lands next to a failed
    # npm publish would pin the repo to a version number it can never ship again.
    needs: [publish-cli, publish-react-native]
    runs-on: macos-latest
    timeout-minutes: 45
    # Holds COCOAPODS_TRUNK_TOKEN (from `pod trunk register`). CocoaPods has no OIDC/trusted-
    # publishing equivalent to npm's, so this is a long-lived secret rather than an id-token
    # exchange -- hence its own protected environment, and no `id-token: write` here.
    environment: cocoapods
    env:
      # CocoaPods drives Ruby's default_external encoding off the locale; on the runner's default
      # POSIX locale a non-ASCII byte anywhere in a podspec or a cloned source path raises
      # `Encoding::CompatibilityError`. Same workaround the iOS test job applies to `pod install`.
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release's tag, not the default branch: AppductCore.podspec reads its version out
          # of packages/react-native/package.json at push time, so the checkout has to be the
          # commit that release actually names.
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Verify the release tag is fetchable from GitHub
        # `pod trunk push` does not upload the working tree -- it clones `s.source`'s git URL at
        # `tag: v#{s.version}` and validates that. A tag that is missing from the remote (a local-
        # only tag, or a release cut from a branch) fails deep inside CocoaPods' downloader with an
        # opaque git error, so check the precondition here where the message can say what is wrong.
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          source_url=$(grep -o 'https://github.com/[^'"'"']*\.git' AppductCore.podspec)
          if [ -z "$(git ls-remote --tags "$source_url" "refs/tags/$RELEASE_TAG")" ]; then
            echo "::error::$RELEASE_TAG is not present at $source_url, which is what 'pod trunk push' clones."
            exit 1
          fi
      - name: Resolve the podspec version
        # Single-sourced from packages/react-native/package.json by the podspec itself; the
        # `package` job has already asserted that this equals the release tag.
        run: |
          version=$(node -p "require('./packages/react-native/package.json').version")
          echo "PODSPEC_VERSION=$version" >> "$GITHUB_ENV"
      - name: Check whether this version is already on trunk
        # Makes a re-run of a partially-failed deploy safe. A duplicate `pod trunk push` is a hard
        # error, so without this any re-run after a successful push fails the whole workflow and
        # obscures whatever actually needed re-running.
        run: |
          # 404 is the expected answer until the very first release, and it returns an empty body --
          # so branch on the status code rather than piping nothing into a JSON parser.
          http=$(curl -sS -o trunk.json -w '%{http_code}' \
            "https://trunk.cocoapods.org/api/v1/pods/AppductCore" || echo 000)
          if [ "$http" = "200" ] && node -e '
              const pod = JSON.parse(require("fs").readFileSync("trunk.json", "utf8"));
              const published = (pod.versions || []).some((v) => v.name === process.argv[1]);
              process.exit(published ? 0 : 1);
            ' "$PODSPEC_VERSION"; then
            echo "ALREADY_PUBLISHED=true" >> "$GITHUB_ENV"
            echo "AppductCore $PODSPEC_VERSION is already on trunk; skipping the push."
          else
            echo "ALREADY_PUBLISHED=false" >> "$GITHUB_ENV"
          fi
      - name: Publish AppductCore to CocoaPods trunk
        if: env.ALREADY_PUBLISHED == 'false'
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        # `pod trunk push` validates locally (clone, lint, build for every platform the podspec
        # declares) and only uploads once that passes, so a validation failure publishes nothing.
        # --allow-warnings is required while the warnings tracked in issue #57 stand. Drop the
        # flag once they are fixed -- until then trunk validation is not a real gate, since a new
        # warning introduced later would pass too.
        run: pod trunk push AppductCore.podspec --allow-warnings
