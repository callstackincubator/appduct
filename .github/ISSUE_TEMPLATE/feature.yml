name: Feature request
description: Something Appduct should do that it does not do today.
labels: ["type:feature", "status:needs-triage"]
body:
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The problem or cost today. Who hits it, and when.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: What you can observe once it exists, phrased so a test could check it. Commands, output, behaviour.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and non-goals
      description: What must not change, security or compatibility limits, what is explicitly out of scope.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: One line each, if any.
