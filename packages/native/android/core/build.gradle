apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'com.callstack.appduct'
version = rootProject.ext.appductVersion

android {
  // Distinct from @appduct/react-native's own AAR namespace ("com.callstack.appduct",
  // packages/react-native/android/build.gradle) despite sharing the `com.callstack.appduct` prefix
  // with it and with the Kotlin package. The AAR namespace and the Kotlin package are unrelated
  // concepts in AGP: this only controls where this module's own generated `R`/`BuildConfig` classes
  // live, and it must differ from the RN module's own namespace so a debug build that links both
  // `@appduct/react-native`'s android module *and* this `core` module (which is exactly what
  // happens once it is vendored in) never collides on a shared manifest package. `core-noop` uses the
  // same namespace as `core` -- the two are never linked into the same build variant at once (one
  // is `debugImplementation`, the other `releaseImplementation`), so they cannot collide with each
  // other, only with the RN module they're paired with.
  namespace 'com.callstack.appduct.core'
  compileSdk rootProject.ext.compileSdkVersion

  defaultConfig {
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion
    consumerProguardFiles 'consumer-rules.pro'
  }

  testOptions {
    unitTests {
      // Required by Robolectric, which backs AppductSpkiPinTest (the only test class that needs a
      // real android.util.Base64 / android.jar runtime). Every other unit test runs on the plain JVM.
      includeAndroidResources = true
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  lintOptions {
    abortOnError false
  }

  // Required by AGP for `components.release` (below) to exist at all -- `com.android.library`
  // does not publish a component by default. `withSourcesJar()` (AGP 7.1+) adds the sources jar
  // Phase 3 asks for, generated straight from this variant's Kotlin/Java sources -- no separate
  // `Jar` task to hand-wire.
  publishing {
    singleVariant('release') {
      withSourcesJar()
      // Central rejects a deployment with no javadoc jar. AGP generates one from the Kotlin/Java
      // sources here; for a Kotlin module it is largely a stub, which Central explicitly permits.
      withJavadocJar()
    }
  }
}

dependencies {
  implementation "com.squareup.okhttp3:okhttp:4.12.0"
  // AppductClient's public API (docs/tasks/16-android-session-logic.md): suspend fun connect/
  // restoreSession/disconnect/postEvent, per-call timeout/cancel via coroutine cancellation.
  // core-noop deliberately does not depend on this (its AppductClient mirror needs no coroutine
  // machinery for a same-signature no-op) -- see that module's build.gradle.
  api "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1"
  api "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
  // ProcessLifecycleOwner: foreground/background observation backing AppductClient's
  // reconnect-pause-while-backgrounded rule (mirrors client/index.ts's AppState handling).
  implementation "androidx.lifecycle:lifecycle-process:2.8.7"

  testImplementation "junit:junit:4.13.2"
  testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1"
  // Real org.json implementation: the stub in android.jar throws "not mocked" for every method at
  // unit-test runtime.
  testImplementation "org.json:json:20180813"
  // Robolectric supplies a real android.util.Base64 (and the rest of android.jar) so
  // AppductSpkiPinTest can call the shipped `computeSpkiPin`/`PinningTrustManager` instead of
  // re-deriving the digest math. Still no emulator: it runs in the same JVM test task.
  testImplementation "org.robolectric:robolectric:4.16"
}

// `${appductScheme}` in src/main/AndroidManifest.xml is deliberately left unresolved by this
// module's own build config -- a real consumer resolves it from their own app's
// `manifestPlaceholders`. AGP resolves a library's manifest placeholders once, at that library's
// own manifest-merge step, baking a literal value into the merged manifest that a downstream
// consumer then inherits verbatim -- proven the hard way: an earlier `defaultConfig.manifestPlaceholders`
// default here leaked into playground-native's own debug build via project substitution, silently
// overriding that app's own `appductScheme` (docs/tasks/19-android-entry-points.md's deviations
// section). So the only placeholder value this module may ever set is one scoped to a component
// real consumers never resolve through: `unitTest`, which needs *some* concrete value purely so
// Robolectric's AppductLinkActivityTest gets a mergeable manifest, and is never published or
// depended on by anything downstream.
androidComponents {
  onVariants(selector().withBuildType("debug")) { variant ->
    variant.unitTest?.manifestPlaceholders?.put("appductScheme", "appduct-core-test")
  }
}

// Maven Central publishing. The POM metadata, signing, and the staged bundle layout all live in
// publishing.gradle, shared with core-noop; these two properties are the only per-module part.
// A consumer declares `debugImplementation("com.callstack.appduct:core:<version>")` -- see
// packages/native/android/README.md.
ext.appductArtifactId = 'core'
ext.appductArtifactDescription = 'Framework-free Android core for Appduct: TLS-pinned session ' +
  'transport, session lifecycle, and tool registry for plain Android apps.'
apply from: "$rootDir/publishing.gradle"
