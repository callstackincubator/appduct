// Shared Maven Central publishing wiring for `core` and `core-noop`, applied by both modules'
// build.gradle. One copy rather than two: the POM metadata Central requires (name, description,
// url, licenses, developers, scm -- all mandatory, a deployment missing any of them is rejected
// at validation) is identical for the two artifacts apart from the description, and Central is
// immutable, so a typo duplicated into both is not something a later release can correct.
//
// Deliberately no third-party publishing plugin. Sonatype ships no official Gradle plugin for the
// Central Portal, and the community ones exist mainly to do what the ~40 lines below already do:
// stage a signed, checksummed repository layout on disk. `deploy.yaml`'s publish-maven job zips
// that directory and POSTs it to the Portal API. Keeping it first-party keeps this project's build
// classpath to AGP and Kotlin, matching the pinning rationale in this project's root build.gradle.
apply plugin: 'maven-publish'
apply plugin: 'signing'

// Set by each module before applying this file.
def artifact = project.ext.appductArtifactId
def artifactDescription = project.ext.appductArtifactDescription

afterEvaluate {
  publishing {
    publications {
      release(MavenPublication) {
        from components.release
        groupId = project.group
        artifactId = artifact
        version = project.version

        pom {
          // Central wants a human-readable name, not the coordinates; it is what shows up in
          // search results.
          name = "Appduct ${artifact}"
          description = artifactDescription
          url = 'https://github.com/callstackincubator/appduct'
          licenses {
            license {
              name = 'MIT License'
              url = 'https://github.com/callstackincubator/appduct/blob/main/LICENSE'
              distribution = 'repo'
            }
          }
          developers {
            developer {
              id = 'V3RON'
              name = 'Szymon Chmal'
              email = 'szymon@chmal.it'
            }
          }
          scm {
            connection = 'scm:git:https://github.com/callstackincubator/appduct.git'
            developerConnection = 'scm:git:ssh://git@github.com/callstackincubator/appduct.git'
            url = 'https://github.com/callstackincubator/appduct'
          }
        }
      }
    }

    repositories {
      // A plain directory, not a remote server: the Central Portal has no Maven-protocol upload
      // endpoint, it takes a single zipped bundle. Publishing to a file repository is what
      // produces the exact layout that bundle must have -- the full group path, plus the .md5 and
      // .sha1 checksums Central requires for every file, generated by Gradle rather than by hand.
      // Both modules point at the same rootProject directory so one zip covers the whole release.
      maven {
        name = 'centralBundle'
        url = rootProject.layout.buildDirectory.dir('central-bundle')
      }
    }
  }

  signing {
    // Only when a key is actually present. test.yaml runs `publishToMavenLocal` on every push to
    // exercise this configuration, and that must keep working on a machine with no signing key --
    // but a real Central deployment is rejected outright if any file is unsigned, so the
    // publish-maven job supplies these and gets signatures.
    def signingKey = providers.environmentVariable('APPDUCT_SIGNING_KEY').orNull
    def signingPassword = providers.environmentVariable('APPDUCT_SIGNING_PASSWORD').orNull
    required { signingKey != null }
    if (signingKey != null) {
      // In-memory rather than a keyring file: CI has the armored private key in a secret, and
      // this avoids materialising it on disk anywhere in the runner's workspace.
      useInMemoryPgpKeys(signingKey, signingPassword)
      sign publishing.publications.release
    }
  }
}
