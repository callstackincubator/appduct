import groovy.json.JsonSlurper

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// Same single-source-of-truth version this repo's other Android modules read
// (packages/native/android/build.gradle, packages/react-native/android/build.gradle) -- purely
// informational here, since settings.gradle's `includeBuild` dependency substitution resolves
// `core`/`core-noop` to the local project regardless of the version string below, but keeping it
// in lockstep avoids a stale, misleading number in this file.
def appductVersion = new JsonSlurper().parse(file("$rootDir/../../packages/react-native/package.json")).version

android {
  namespace 'com.callstack.appduct.playground'
  compileSdk rootProject.ext.compileSdkVersion

  defaultConfig {
    applicationId 'com.callstack.appduct.playground'
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion
    versionCode 1
    versionName '1.0'
    // The deep-link scheme AppductLinkActivity's intent filter (core's own AndroidManifest.xml)
    // resolves ${appductScheme} against -- forgetting this on a real consumer app is a
    // manifest-merger error at build time (packages/native/android/README.md's troubleshooting
    // section has the exact message this playground deliberately reproduces and documents).
    manifestPlaceholders = [appductScheme: "appduct-native"]
  }

  buildFeatures {
    compose true
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  lintOptions {
    abortOnError false
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }
}

dependencies {
  // The whole point of this playground: a debug build gets the real Appduct core, a release
  // build gets the inert no-op -- exactly the pairing issue #48 phase 3 asks a plain Android app
  // to declare, resolved here to the local project via settings.gradle's `includeBuild` instead of
  // a published Maven artifact.
  debugImplementation "com.callstack.appduct:core:${appductVersion}"
  releaseImplementation "com.callstack.appduct:core-noop:${appductVersion}"

  implementation platform('androidx.compose:compose-bom:2024.09.00')
  implementation 'androidx.compose.ui:ui'
  implementation 'androidx.compose.ui:ui-graphics'
  implementation 'androidx.compose.material3:material3'
  implementation 'androidx.activity:activity-compose:1.9.3'
  implementation 'androidx.core:core-ktx:1.13.1'
  implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

  debugImplementation 'androidx.compose.ui:ui-tooling'
  implementation 'androidx.compose.ui:ui-tooling-preview'
}
