// Root build script for the native (non-React-Native) Cordierite playground
// (docs/tasks/19-android-entry-points.md, issue #48 phase 3). AGP/Kotlin versions match
// packages/native/android's own root build.gradle -- this app consumes that project's `core`/
// `core-noop` modules directly (see settings.gradle's `includeBuild`), so the two builds must
// agree on toolchain versions or Gradle's composite-build project substitution fails at
// configuration time.
buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle:8.11.0')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.20')
    // Compose's own Gradle plugin, matched to the Kotlin version above -- since Kotlin 2.0 the
    // Compose compiler ships as a Gradle plugin versioned in lockstep with Kotlin itself, not a
    // separately-versioned `compose-compiler` artifact resolved by a lookup table.
    classpath('org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.1.20')
  }
}

ext {
  compileSdkVersion = 35
  minSdkVersion = 24
  targetSdkVersion = 35
}

allprojects {
  repositories {
    google()
    mavenCentral()
  }
}
