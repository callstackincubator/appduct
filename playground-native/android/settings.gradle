pluginManagement {
  repositories {
    google()
    mavenCentral()
    gradlePluginPortal()
  }
}

rootProject.name = 'appduct-playground-native'

// Substitutes `com.callstackincubator.appduct:core`/`:core-noop` with the local Gradle
// projects from packages/native/android instead of resolving a published Maven artifact --
// exactly the composite-build wiring issue #48 phase 3 sketches, and how this playground stays
// in lockstep with the native core as it's developed, with no publish-then-consume round trip.
// `packages/native/android`'s own `settings.gradle` names these projects `:core`/`:core-noop`
// (rootProject.name = 'appduct-native' there, distinct from this build's own root project
// name above, so the two composite builds' project names never collide).
includeBuild("../../packages/native/android") {
  dependencySubstitution {
    substitute(module("com.callstackincubator.appduct:core")).using(project(":core"))
    substitute(module("com.callstackincubator.appduct:core-noop")).using(project(":core-noop"))
  }
}

include ':app'
